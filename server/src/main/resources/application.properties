# ===============================================
# VaultFlow Spring Boot Application Configuration
# ===============================================

spring.application.name=vaultflow-backend

# Server
server.port=${PORT:8080}
server.servlet.context-path=/

# MongoDB Atlas
# Local development: Uses FT_PASSWORD from Windows Environment Variables.
# Deployment: Uses MONGODB_URI if provided.
spring.data.mongodb.uri=${MONGODB_URI:mongodb+srv://anuvab7903_db_user:${FT_PASSWORD}@cluster0.bywjc8p.mongodb.net/vaultflow?retryWrites=true&w=majority}
spring.data.mongodb.auto-index-creation=true
spring.data.mongodb.representation.big-decimal=decimal128

# JWT
vaultflow.jwt.secret=${JWT_SECRET}
vaultflow.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# CORS
vaultflow.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,https://your-vaultflow.vercel.app}

# Logging
logging.level.com.vaultflow=INFO
logging.level.org.springframework.security=WARN